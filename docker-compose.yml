services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: agriscope
      POSTGRES_USER: agriscope
      POSTGRES_PASSWORD: agriscope_dev_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agriscope -d agriscope"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: agriscope
      MINIO_ROOT_PASSWORD: agriscope_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
