{
  "openapi": "3.1.0",
  "info": {
    "title": "AgriScope Thailand API",
    "version": "0.1.0",
    "description": "Contract-first API for multi-tenant agricultural satellite analysis."
  },
  "servers": [
    {
      "url": "/"
    }
  ],
  "components": {
    "securitySchemes": {
      "accessCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "agriscope_access"
      },
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "access token"
      },
      "refreshCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "agriscope_refresh"
      },
      "csrfCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "agriscope_csrf"
      },
      "csrfHeader": {
        "type": "apiKey",
        "in": "header",
        "name": "X-CSRF-Token"
      }
    },
    "responses": {
      "UnauthorizedError": {
        "description": "Authentication required.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      },
      "ForbiddenError": {
        "description": "CSRF validation or role authorization failed.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      },
      "NotFoundError": {
        "description": "Scoped resource not found.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      },
      "ValidationError": {
        "description": "Request validation failed.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      },
      "RateLimitedError": {
        "description": "Rate limit exceeded.",
        "headers": {
          "Retry-After": {
            "required": true,
            "schema": {
              "type": "integer",
              "minimum": 1
            }
          }
        },
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      }
    },
    "schemas": {
      "CsrfResponse": {
        "type": "object",
        "required": [
          "csrf_token"
        ],
        "properties": {
          "csrf_token": {
            "type": "string",
            "minLength": 1
          }
        }
      },
      "ErrorResponse": {
        "type": "object",
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "object",
            "required": [
              "code",
              "message",
              "request_id",
              "details"
            ],
            "properties": {
              "code": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "request_id": {
                "type": "string"
              },
              "details": {
                "type": "object",
                "additionalProperties": true
              }
            }
          }
        },
        "example": {
          "error": {
            "code": "validation_error",
            "message": "Request validation failed",
            "request_id": "018f1b46-0637-7000-9000-000000000001",
            "details": {}
          }
        }
      },
      "RegisterRequest": {
        "type": "object",
        "required": [
          "email",
          "password",
          "display_name",
          "organization_name"
        ],
        "properties": {
          "email": {
            "type": "string",
            "format": "email"
          },
          "password": {
            "type": "string",
            "minLength": 12
          },
          "display_name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 160
          },
          "organization_name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          }
        },
        "example": {
          "email": "owner@example.com",
          "password": "StrongPassword123",
          "display_name": "Owner",
          "organization_name": "Example Farm Co"
        }
      },
      "LoginRequest": {
        "type": "object",
        "required": [
          "email",
          "password"
        ],
        "properties": {
          "email": {
            "type": "string",
            "format": "email"
          },
          "password": {
            "type": "string"
          }
        },
        "example": {
          "email": "owner@example.com",
          "password": "StrongPassword123"
        }
      },
      "User": {
        "type": "object",
        "required": [
          "id",
          "email",
          "display_name"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "email": {
            "type": "string",
            "format": "email"
          },
          "display_name": {
            "type": "string"
          }
        }
      },
      "Organization": {
        "type": "object",
        "required": [
          "id",
          "name",
          "slug",
          "status"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "name": {
            "type": "string"
          },
          "slug": {
            "type": "string"
          },
          "logo_url": {
            "type": "string",
            "nullable": true
          },
          "plan_code": {
            "type": "string"
          },
          "status": {
            "type": "string",
            "enum": [
              "active",
              "suspended",
              "deleted"
            ]
          }
        },
        "example": {
          "id": "018f1b46-0637-7000-9000-000000000010",
          "name": "Example Farm Co",
          "slug": "example-farm-co-a1b2c3d4",
          "plan_code": "starter",
          "status": "active"
        }
      },
      "RegisterResponse": {
        "type": "object",
        "required": [
          "user",
          "organization"
        ],
        "properties": {
          "user": {
            "$ref": "#/components/schemas/User"
          },
          "organization": {
            "$ref": "#/components/schemas/Organization"
          }
        }
      },
      "Member": {
        "type": "object",
        "required": [
          "id",
          "user_id",
          "role",
          "status"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "user_id": {
            "type": "string",
            "format": "uuid"
          },
          "role": {
            "type": "string",
            "enum": [
              "organization_owner",
              "organization_admin",
              "agronomist",
              "field_manager",
              "viewer"
            ]
          },
          "status": {
            "type": "string",
            "enum": [
              "active",
              "disabled",
              "invited"
            ]
          }
        }
      },
      "OrganizationCreateRequest": {
        "type": "object",
        "required": [
          "name"
        ],
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          }
        },
        "example": {
          "name": "North Field Cooperative"
        }
      },
      "FarmCreateRequest": {
        "type": "object",
        "required": [
          "organization_id",
          "name"
        ],
        "properties": {
          "organization_id": {
            "type": "string",
            "format": "uuid"
          },
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          },
          "province": {
            "type": "string",
            "maxLength": 120,
            "nullable": true
          }
        },
        "example": {
          "organization_id": "018f1b46-0637-7000-9000-000000000010",
          "name": "Farm 1",
          "province": "Chiang Mai"
        }
      },
      "FarmUpdateRequest": {
        "type": "object",
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          },
          "province": {
            "type": "string",
            "maxLength": 120,
            "nullable": true
          }
        },
        "example": {
          "name": "Farm 1 North",
          "province": "Chiang Mai"
        }
      },
      "Farm": {
        "type": "object",
        "required": [
          "id",
          "organization_id",
          "name",
          "status",
          "created_at",
          "updated_at"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "organization_id": {
            "type": "string",
            "format": "uuid"
          },
          "name": {
            "type": "string"
          },
          "province": {
            "type": "string",
            "nullable": true
          },
          "status": {
            "type": "string",
            "enum": [
              "active",
              "deleted"
            ]
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "updated_at": {
            "type": "string",
            "format": "date-time"
          }
        },
        "example": {
          "id": "018f1b46-0637-7000-9000-000000000020",
          "organization_id": "018f1b46-0637-7000-9000-000000000010",
          "name": "Farm 1",
          "province": "Chiang Mai",
          "status": "active",
          "created_at": "2026-08-01T09:00:00Z",
          "updated_at": "2026-08-01T09:00:00Z"
        }
      },
      "GeoJsonPolygon": {
        "type": "object",
        "required": [
          "type",
          "coordinates"
        ],
        "properties": {
          "type": {
            "type": "string",
            "enum": [
              "Polygon"
            ]
          },
          "coordinates": {
            "type": "array",
            "minItems": 1,
            "items": {
              "type": "array",
              "minItems": 4,
              "items": {
                "type": "array",
                "minItems": 2,
                "maxItems": 2,
                "items": {
                  "type": "number"
                }
              }
            }
          }
        },
        "example": {
          "type": "Polygon",
          "coordinates": [
            [
              [
                98.9801,
                18.7901
              ],
              [
                98.9811,
                18.7901
              ],
              [
                98.9811,
                18.7911
              ],
              [
                98.9801,
                18.7911
              ],
              [
                98.9801,
                18.7901
              ]
            ]
          ]
        }
      },
      "FieldCreateRequest": {
        "type": "object",
        "required": [
          "name",
          "geometry"
        ],
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          },
          "geometry": {
            "$ref": "#/components/schemas/GeoJsonPolygon"
          }
        },
        "example": {
          "name": "Field A",
          "geometry": {
            "type": "Polygon",
            "coordinates": [
              [
                [
                  98.9801,
                  18.7901
                ],
                [
                  98.9811,
                  18.7901
                ],
                [
                  98.9811,
                  18.7911
                ],
                [
                  98.9801,
                  18.7911
                ],
                [
                  98.9801,
                  18.7901
                ]
              ]
            ]
          }
        }
      },
      "FieldUpdateRequest": {
        "type": "object",
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          },
          "geometry": {
            "$ref": "#/components/schemas/GeoJsonPolygon"
          }
        },
        "example": {
          "name": "Field A North"
        }
      },
      "Field": {
        "type": "object",
        "required": [
          "id",
          "farm_id",
          "organization_id",
          "name",
          "geometry",
          "area_sqm",
          "area_rai",
          "status",
          "created_at",
          "updated_at"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "farm_id": {
            "type": "string",
            "format": "uuid"
          },
          "organization_id": {
            "type": "string",
            "format": "uuid"
          },
          "name": {
            "type": "string"
          },
          "geometry": {
            "$ref": "#/components/schemas/GeoJsonPolygon"
          },
          "area_sqm": {
            "type": "number"
          },
          "area_rai": {
            "type": "number"
          },
          "status": {
            "type": "string",
            "enum": [
              "active",
              "deleted"
            ]
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "updated_at": {
            "type": "string",
            "format": "date-time"
          }
        },
        "example": {
          "id": "018f1b46-0637-7000-9000-000000000030",
          "farm_id": "018f1b46-0637-7000-9000-000000000020",
          "organization_id": "018f1b46-0637-7000-9000-000000000010",
          "name": "Field A",
          "geometry": {
            "type": "Polygon",
            "coordinates": [
              [
                [
                  98.9801,
                  18.7901
                ],
                [
                  98.9811,
                  18.7901
                ],
                [
                  98.9811,
                  18.7911
                ],
                [
                  98.9801,
                  18.7911
                ],
                [
                  98.9801,
                  18.7901
                ]
              ]
            ]
          },
          "area_sqm": 11726.42,
          "area_rai": 7.329,
          "status": "active",
          "created_at": "2026-08-01T09:00:00Z",
          "updated_at": "2026-08-01T09:00:00Z"
        }
      },
      "SatelliteAcquisition": {
        "type": "object",
        "required": [
          "provider",
          "collection",
          "item_id",
          "acquired_at"
        ],
        "properties": {
          "provider": {
            "type": "string",
            "enum": [
              "cdse_stac"
            ]
          },
          "collection": {
            "type": "string",
            "enum": [
              "sentinel-2-l2a"
            ]
          },
          "item_id": {
            "type": "string"
          },
          "acquired_at": {
            "type": "string",
            "format": "date-time"
          },
          "cloud_cover_percent": {
            "type": "number",
            "nullable": true
          }
        },
        "example": {
          "provider": "cdse_stac",
          "collection": "sentinel-2-l2a",
          "item_id": "S2B_MSIL2A_20260731T035529_N0511_R004_T47PPR_20260731T072142",
          "acquired_at": "2026-07-31T03:55:29Z",
          "cloud_cover_percent": 12.4
        }
      },
      "SatelliteAvailableResponse": {
        "type": "object",
        "required": [
          "field_id",
          "status",
          "acquisition",
          "searched_at",
          "message_th"
        ],
        "properties": {
          "field_id": {
            "type": "string",
            "format": "uuid"
          },
          "status": {
            "const": "available"
          },
          "acquisition": {
            "$ref": "#/components/schemas/SatelliteAcquisition"
          },
          "searched_at": {
            "type": "string",
            "format": "date-time"
          },
          "message_th": {
            "type": "string"
          }
        }
      },
      "SatelliteNotSearchedResponse": {
        "type": "object",
        "required": [
          "field_id",
          "status",
          "acquisition",
          "searched_at",
          "message_th"
        ],
        "properties": {
          "field_id": {
            "type": "string",
            "format": "uuid"
          },
          "status": {
            "const": "not_searched"
          },
          "acquisition": {
            "type": "null"
          },
          "searched_at": {
            "type": "null"
          },
          "message_th": {
            "type": "string"
          }
        }
      },
      "SatelliteEmptySearchResponse": {
        "type": "object",
        "required": [
          "field_id",
          "status",
          "acquisition",
          "searched_at",
          "message_th"
        ],
        "properties": {
          "field_id": {
            "type": "string",
            "format": "uuid"
          },
          "status": {
            "type": "string",
            "enum": [
              "no_data",
              "temporarily_unavailable"
            ]
          },
          "acquisition": {
            "type": "null"
          },
          "searched_at": {
            "type": "string",
            "format": "date-time"
          },
          "message_th": {
            "type": "string"
          }
        }
      },
      "SatelliteLatestResponse": {
        "oneOf": [
          {
            "$ref": "#/components/schemas/SatelliteAvailableResponse"
          },
          {
            "$ref": "#/components/schemas/SatelliteNotSearchedResponse"
          },
          {
            "$ref": "#/components/schemas/SatelliteEmptySearchResponse"
          }
        ],
        "discriminator": {
          "propertyName": "status",
          "mapping": {
            "available": "#/components/schemas/SatelliteAvailableResponse",
            "not_searched": "#/components/schemas/SatelliteNotSearchedResponse",
            "no_data": "#/components/schemas/SatelliteEmptySearchResponse",
            "temporarily_unavailable": "#/components/schemas/SatelliteEmptySearchResponse"
          }
        }
      },
      "SatelliteSearchResponse": {
        "oneOf": [
          {
            "$ref": "#/components/schemas/SatelliteAvailableResponse"
          },
          {
            "$ref": "#/components/schemas/SatelliteEmptySearchResponse"
          }
        ],
        "discriminator": {
          "propertyName": "status",
          "mapping": {
            "available": "#/components/schemas/SatelliteAvailableResponse",
            "no_data": "#/components/schemas/SatelliteEmptySearchResponse",
            "temporarily_unavailable": "#/components/schemas/SatelliteEmptySearchResponse"
          }
        }
      },
      "SatelliteNdviSummary": {
        "type": "object",
        "required": [
          "field_id",
          "acquired_at",
          "period_basis",
          "algorithm_version",
          "ndvi_mean",
          "ndvi_min",
          "ndvi_max",
          "ndvi_stddev",
          "sample_count",
          "valid_sample_count",
          "valid_pixel_ratio"
        ],
        "properties": {
          "field_id": {
            "type": "string",
            "format": "uuid"
          },
          "acquired_at": {
            "type": "string",
            "format": "date-time"
          },
          "period_basis": {
            "const": "utc_day"
          },
          "algorithm_version": {
            "const": "agriscope-ndvi-summary-v1"
          },
          "ndvi_mean": {
            "type": "number",
            "minimum": -1,
            "maximum": 1
          },
          "ndvi_min": {
            "type": "number",
            "minimum": -1,
            "maximum": 1
          },
          "ndvi_max": {
            "type": "number",
            "minimum": -1,
            "maximum": 1
          },
          "ndvi_stddev": {
            "type": "number",
            "minimum": 0,
            "maximum": 1
          },
          "sample_count": {
            "type": "integer",
            "minimum": 1
          },
          "valid_sample_count": {
            "type": "integer",
            "minimum": 1
          },
          "valid_pixel_ratio": {
            "type": "number",
            "exclusiveMinimum": 0,
            "maximum": 1
          }
        }
      }
    }
  },
  "paths": {
    "/health/live": {
      "get": {
        "summary": "Liveness check.",
        "security": [],
        "x-idempotency": "safe read-only operation.",
        "responses": {
          "200": {
            "description": "Process is alive."
          }
        }
      }
    },
    "/health/ready": {
      "get": {
        "summary": "Readiness check.",
        "security": [],
        "x-idempotency": "safe read-only operation.",
        "responses": {
          "200": {
            "description": "Configuration is valid and the app can serve traffic."
          },
          "503": {
            "description": "Required readiness check failed.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          }
        }
      }
    },
    "/health/dependencies": {
      "get": {
        "summary": "Safe dependency status.",
        "security": [],
        "x-idempotency": "safe read-only operation.",
        "responses": {
          "200": {
            "description": "Masked dependency status for database, Redis, and object storage."
          }
        }
      }
    },
    "/api/v1/auth/csrf": {
      "get": {
        "summary": "Issue a bounded opaque double-submit CSRF token.",
        "security": [],
        "x-required-role": "none",
        "x-organization-scope": "none.",
        "x-validation": "cryptographically random token; host-only cookie; no-store response.",
        "x-rate-limit": "trusted-client-IP aggregate 60 per configured fixed window.",
        "x-idempotency": "safe bootstrap; each success rotates the CSRF value.",
        "responses": {
          "200": {
            "description": "CSRF token issued with agriscope_csrf cookie and no-store headers.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CsrfResponse"
                }
              }
            }
          },
          "429": {
            "$ref": "#/components/responses/RateLimitedError"
          }
        }
      }
    },
    "/api/v1/auth/register": {
      "post": {
        "summary": "Register user, organization, and owner membership atomically.",
        "security": [
          {
            "csrfCookie": [],
            "csrfHeader": []
          }
        ],
        "x-required-role": "none",
        "x-organization-scope": "creates first organization for the new user.",
        "x-validation": "email normalized, password strength enforced, duplicate email rejected.",
        "x-rate-limit": "trusted-client-IP 25 and HMAC(normalized email) 5 per configured window.",
        "x-idempotency": "not idempotent; duplicate email returns 409.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/RegisterRequest"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Registered.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RegisterResponse"
                }
              }
            }
          },
          "400": {
            "description": "Invalid input.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "403": {
            "description": "CSRF token or Origin validation failed.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "409": {
            "description": "Email already registered.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "422": {
            "description": "Request validation failed.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "429": {
            "$ref": "#/components/responses/RateLimitedError"
          }
        }
