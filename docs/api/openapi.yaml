openapi: 3.1.0
info:
  title: AgriScope Thailand API
  version: 0.1.0
  description: Contract-first API for multi-tenant agricultural satellite analysis.
servers:
  - url: /api/v1
security:
  - cookieSession: []
components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: agriscope_session
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlation_id]
          properties:
            code: { type: string }
            message: { type: string }
            correlation_id: { type: string }
            details: { type: object, additionalProperties: true }
    Organization:
      type: object
      required: [id, name, slug, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        logo_url: { type: string, nullable: true }
        plan_code: { type: string }
        status: { type: string, enum: [active, suspended, deleted] }
    FieldGeometryValidationRequest:
      type: object
      required: [geometry]
      properties:
        geometry:
          type: object
          description: GeoJSON Polygon or MultiPolygon in EPSG:4326 using longitude, latitude coordinate order.
    FieldGeometryValidationResponse:
      type: object
      required: [valid, area_sqm, area_rai, area_hectare, warnings]
      properties:
        valid: { type: boolean }
        area_sqm: { type: number }
        area_rai: { type: number }
        area_hectare: { type: number }
        centroid:
          type: object
          additionalProperties: true
        warnings:
          type: array
          items: { type: string }
    ObservationQuality:
      type: object
      required:
        - valid_pixel_ratio
        - cloud_pixel_ratio
        - shadow_pixel_ratio
        - no_data_ratio
        - quality_score
        - analysis_confidence
        - quality_reason
      properties:
        valid_pixel_ratio: { type: number, minimum: 0, maximum: 1 }
        cloud_pixel_ratio: { type: number, minimum: 0, maximum: 1 }
        shadow_pixel_ratio: { type: number, minimum: 0, maximum: 1 }
        no_data_ratio: { type: number, minimum: 0, maximum: 1 }
        quality_score: { type: number, minimum: 0, maximum: 1 }
        analysis_confidence:
          type: string
          enum: [not_analyzable, low, medium, high]
        quality_reason: { type: string }
paths:
  /auth/register:
    post:
      summary: Register a user.
      responses:
        "201": { description: Registered }
        "400":
          description: Invalid input
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /auth/login:
    post:
      summary: Login with email and password and set HttpOnly cookie.
      responses:
        "204": { description: Logged in }
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /organizations:
    get:
      summary: List organizations for the current user.
      responses:
        "200":
          description: Organizations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Organization" }
    post:
      summary: Create organization.
      responses:
        "201": { description: Created }
  /fields/{field_id}/validate-geometry:
    post:
      summary: Validate field geometry and return authoritative area.
      parameters:
        - name: field_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FieldGeometryValidationRequest" }
      responses:
        "200":
          description: Geometry validation result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldGeometryValidationResponse" }
        "422":
          description: Invalid geometry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /fields/{field_id}/observations/latest:
    get:
      summary: Latest field observation with quality metadata.
      parameters:
        - name: field_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Latest observation }
        "404": { description: No usable observation }
  /fields/{field_id}/analysis/request:
    post:
      summary: Request idempotent field analysis.
      parameters:
        - name: field_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "202": { description: Analysis job accepted }
        "429": { description: Organization or provider quota exceeded }
  /alerts/{id}/acknowledge:
    post:
      summary: Acknowledge an alert event.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Acknowledged }
