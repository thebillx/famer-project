openapi: 3.1.0
info:
  title: AgriScope Thailand API
  version: 0.1.0
  description: Contract-first API for multi-tenant agricultural satellite analysis.
servers:
  - url: /
components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: agriscope_refresh
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id, details]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
            details: { type: object, additionalProperties: true }
      example:
        error:
          code: validation_error
          message: Request validation failed
          request_id: 018f1b46-0637-7000-9000-000000000001
          details: {}
    RegisterRequest:
      type: object
      required: [email, password, display_name, organization_name]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 12 }
        display_name: { type: string, minLength: 1, maxLength: 160 }
        organization_name: { type: string, minLength: 1, maxLength: 200 }
      example:
        email: owner@example.com
        password: StrongPassword123
        display_name: Owner
        organization_name: Example Farm Co
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
      example:
        email: owner@example.com
        password: StrongPassword123
    User:
      type: object
      required: [id, email, display_name]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
    Organization:
      type: object
      required: [id, name, slug, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        logo_url: { type: string, nullable: true }
        plan_code: { type: string }
        status: { type: string, enum: [active, suspended, deleted] }
      example:
        id: 018f1b46-0637-7000-9000-000000000010
        name: Example Farm Co
        slug: example-farm-co-a1b2c3d4
        plan_code: starter
        status: active
    RegisterResponse:
      type: object
      required: [user, organization]
      properties:
        user: { $ref: "#/components/schemas/User" }
        organization: { $ref: "#/components/schemas/Organization" }
    Member:
      type: object
      required: [id, user_id, role, status]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        role:
          type: string
          enum: [organization_owner, organization_admin, agronomist, field_manager, viewer]
        status: { type: string, enum: [active, disabled, invited] }
    OrganizationCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
      example:
        name: North Field Cooperative
paths:
  /health/live:
    get:
      summary: Liveness check.
      security: []
      x-rate-limit: low-cost unauthenticated health endpoint.
      x-idempotency: safe read-only operation.
      responses:
        "200":
          description: Process is alive.
  /health/ready:
    get:
      summary: Readiness check.
      security: []
      x-rate-limit: low-cost unauthenticated health endpoint.
      x-idempotency: safe read-only operation.
      responses:
        "200":
          description: Configuration is valid and the app can serve traffic.
        "503":
          description: Required readiness check failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /health/dependencies:
    get:
      summary: Safe dependency status.
      security: []
      x-rate-limit: low-cost unauthenticated health endpoint.
      x-idempotency: safe read-only operation.
      responses:
        "200":
          description: Masked dependency status for database, Redis, and object storage.
  /api/v1/auth/register:
    post:
      summary: Register user, organization, and owner membership atomically.
      security: []
      x-required-role: none
      x-organization-scope: creates first organization for the new user.
      x-validation: email normalized, password strength enforced, duplicate email rejected.
      x-rate-limit: strict unauthenticated auth limit.
      x-idempotency: not idempotent; duplicate email returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisterResponse" }
        "400":
          description: Invalid input.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Email already registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/auth/login:
    post:
      summary: Login with generic failure messages and set HttpOnly refresh cookie.
      security: []
      x-required-role: none
      x-organization-scope: membership checked by later organization-scoped endpoints.
      x-validation: email normalized, generic auth failure.
      x-rate-limit: strict unauthenticated auth limit.
      x-idempotency: not idempotent; creates a refresh session.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "204": { description: Logged in. }
        "401":
          description: Invalid credentials.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/auth/logout:
    post:
      summary: Revoke current refresh session and delete auth cookie.
      security:
        - cookieSession: []
      x-required-role: authenticated user.
      x-organization-scope: none.
      x-validation: refresh session must be active.
      x-rate-limit: authenticated user limit.
      x-idempotency: effectively idempotent after revocation.
      responses:
        "204": { description: Logged out. }
        "401":
          description: Missing or invalid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/auth/refresh:
    post:
      summary: Rotate refresh session and issue a new access token.
      security:
        - cookieSession: []
      x-required-role: authenticated user.
      x-organization-scope: none.
      x-validation: refresh token type, expiration, and active session checked.
      x-rate-limit: authenticated user limit.
      x-idempotency: not idempotent; rotates session.
      responses:
        "204": { description: Refreshed. }
        "401":
          description: Missing, invalid, expired, or revoked refresh session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/auth/me:
    get:
      summary: Current authenticated user.
      security:
        - cookieSession: []
      x-required-role: authenticated user.
      x-organization-scope: none.
      x-validation: access token type and expiration checked.
      x-rate-limit: authenticated user limit.
      x-idempotency: safe read-only operation.
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          description: Missing or invalid authentication.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/organizations:
    post:
      summary: Create an organization for the current user.
      security:
        - cookieSession: []
      x-required-role: authenticated user.
      x-organization-scope: creates organization and owner membership.
      x-validation: name required, slug generated collision-safe.
      x-rate-limit: authenticated mutation limit.
      x-idempotency: not idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationCreateRequest" }
      responses:
        "201":
          description: Created organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
    get:
      summary: List organizations visible to current user.
      security:
        - cookieSession: []
      x-required-role: active membership.
      x-organization-scope: scoped by active memberships for current user.
      x-validation: disabled memberships excluded.
      x-rate-limit: authenticated read limit.
      x-idempotency: safe read-only operation.
      responses:
        "200":
          description: Organizations.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Organization" }
  /api/v1/organizations/{organization_id}:
    get:
      summary: Get organization if current user has active membership.
      security:
        - cookieSession: []
      x-required-role: viewer
      x-organization-scope: query scopes by organization id and active membership.
      x-validation: invalid UUID rejected; foreign organization returns 404.
      x-rate-limit: authenticated read limit.
      x-idempotency: safe read-only operation.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "404":
          description: Not found or not visible.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/organizations/{organization_id}/members:
    get:
      summary: List organization members for active members.
      security:
        - cookieSession: []
      x-required-role: viewer
      x-organization-scope: organization id and current active membership required.
      x-validation: disabled membership denied; foreign organization returns 404.
      x-rate-limit: authenticated read limit.
      x-idempotency: safe read-only operation.
      parameters:
        - name: organization_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Members.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Member" }
