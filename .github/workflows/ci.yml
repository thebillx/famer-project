name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/**

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"

      - name: Verify Node.js and npm versions
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Web typecheck
        run: npm -w apps/web run typecheck

      - name: Web production build
        run: npm -w apps/web run build

      - name: Install pinned Python dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input pip==25.0.1
          python -m pip install --disable-pip-version-check --no-input -e '.[dev]'

      - name: Unit tests
        run: python3 -m unittest discover -s tests/unit

      - name: Contract tests
        run: python3 -m unittest discover -s tests/contract

      - name: Whitespace check
        run: git diff --check

      - name: JSON validation
        run: |
          python3 - <<'PY'
          import json
          import pathlib

          for path in pathlib.Path(".").rglob("*.json"):
              if any(part in {".git", "node_modules", ".venv", "venv"} for part in path.parts):
                  continue
              with path.open() as file:
                  json.load(file)
              print(f"json-ok {path}")
          PY

      - name: YAML validation where available
        run: |
          python3 - <<'PY'
          import pathlib

          try:
              import yaml
          except ModuleNotFoundError:
              print("YAML validation NOT_RUN: PyYAML is not installed")
              raise SystemExit(0)

          for suffix in ("*.yaml", "*.yml"):
              for path in pathlib.Path(".").rglob(suffix):
                  if any(part in {".git", "node_modules", ".venv", "venv"} for part in path.parts):
                      continue
                  with path.open() as file:
                      yaml.safe_load(file)
                  print(f"yaml-ok {path}")
          PY

      - name: Optional tool availability
        run: |
          for tool in ruff mypy; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "$tool available"
            else
              echo "$tool NOT_RUN: executable is not installed"
            fi
          done

  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_DB: agriscope_test_ci
          POSTGRES_USER: agriscope_test_ci
          POSTGRES_PASSWORD: integration-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agriscope_test_ci -d agriscope_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+psycopg://agriscope_test_ci:integration-test-only@127.0.0.1:5432/agriscope_test_ci
      AGRISCOPE_TEST_DATABASE_URL: postgresql+psycopg://agriscope_test_ci:integration-test-only@127.0.0.1:5432/agriscope_test_ci
      APP_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pinned Python dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input pip==25.0.1
          python -m pip install --disable-pip-version-check --no-input -e '.[dev]'

      - name: Apply migrations
        run: python -m alembic -c apps/api/alembic.ini upgrade head

      - name: Integration tests
        run: python -m pytest tests/integration/test_foundation_api.py -q
