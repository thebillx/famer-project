name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/**

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"

      - name: Verify Node.js and npm versions
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Install pinned Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-input pip==25.0.1
          .venv/bin/python -m pip install --disable-pip-version-check --no-input -e '.[dev]'

      - name: Static validation
        run: AGRISCOPE_PYTHON=.venv/bin/python bash scripts/validate.sh static

  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_DB: agriscope_test_ci
          POSTGRES_USER: agriscope_test_ci
          POSTGRES_PASSWORD: integration-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agriscope_test_ci -d agriscope_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+psycopg://agriscope_test_ci:integration-test-only@127.0.0.1:5432/agriscope_test_ci
      AGRISCOPE_TEST_DATABASE_URL: postgresql+psycopg://agriscope_test_ci:integration-test-only@127.0.0.1:5432/agriscope_test_ci
      APP_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pinned Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-input pip==25.0.1
          .venv/bin/python -m pip install --disable-pip-version-check --no-input -e '.[dev]'

      - name: Integration validation
        run: AGRISCOPE_PYTHON=.venv/bin/python bash scripts/validate.sh integration

  browser-regression:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_DB: agriscope_test_browser_ci
          POSTGRES_USER: agriscope_test_browser_ci
          POSTGRES_PASSWORD: browser-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agriscope_test_browser_ci -d agriscope_test_browser_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+psycopg://agriscope_test_browser_ci:browser-test-only@127.0.0.1:5432/agriscope_test_browser_ci
      AGRISCOPE_TEST_DATABASE_URL: postgresql+psycopg://agriscope_test_browser_ci:browser-test-only@127.0.0.1:5432/agriscope_test_browser_ci
      APP_ENV: test
      MAP_VISUAL_ARTIFACT_DIR: test-results/agriscope-visuals

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"

      - name: Verify Node.js and npm versions
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Create browser-test Python environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-input pip==25.0.1
          .venv/bin/python -m pip install --disable-pip-version-check --no-input -e '.[dev]'

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Browser validation
        run: AGRISCOPE_PYTHON=.venv/bin/python bash scripts/validate.sh browser

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agriscope-browser-failure-${{ github.sha }}
          path: test-results
          if-no-files-found: warn
          retention-days: 14
