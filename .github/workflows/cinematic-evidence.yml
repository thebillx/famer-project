name: Cinematic review evidence

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/cinematic-evidence.yml"
      - "apps/web/app/page.tsx"
      - "apps/web/app/cinematic-lab/**"
      - "apps/web/app/login/page.tsx"
      - "apps/web/components/cinematic/**"
      - "apps/web/public/cinematic/**"
      - "docs/product/cinematic-*"
      - "tests/cinematic/**"
      - "tests/e2e/cinematic-flow-002.spec.ts"
      - "tests/e2e/cinematic-lab-001.spec.ts"
      - "tests/e2e/landing-001.spec.ts"

permissions:
  contents: read

jobs:
  cinematic-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"

      - name: Verify checked-out source
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Install pinned JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Select installed Playwright Chromium
        run: |
          chromium_path="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')"
          echo "CINEMATIC_CHROMIUM=$chromium_path" >> "$GITHUB_ENV"

      - name: Validate authored cinematic fixtures and five-shot timeline
        run: |
          python3 tests/cinematic/crop-authoring.py
          python3 tests/cinematic/runtime-art-transfer-args.py
          node tests/cinematic/runtime-materials.mjs
          node tests/cinematic/blender-assets.mjs
          node tests/cinematic/timeline.mjs

      - name: Build the reviewed head in production mode
        run: npm run build --workspace apps/web

      - name: Start the reviewed head
        run: |
          npm run start --workspace apps/web -- --hostname 127.0.0.1 --port 5184 > /tmp/agriscope-next.log 2>&1 &
          echo $! > /tmp/agriscope-next.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5184/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/agriscope-next.log
          exit 1

      - name: Run actual browser evidence for the public landing
        env:
          CINEMATIC_EVIDENCE: evidence/landing
          CINEMATIC_SOFTWARE_WEBGL: "1"
          CINEMATIC_URL: http://127.0.0.1:5184/
        run: node tests/cinematic/browser.mjs

      - name: Run actual browser evidence for the cinematic lab route
        env:
          CINEMATIC_EVIDENCE: evidence/lab
          CINEMATIC_SOFTWARE_WEBGL: "1"
          CINEMATIC_URL: http://127.0.0.1:5184/cinematic-lab
        run: node tests/cinematic/browser.mjs

      - name: Run focused landing and lab journey tests
        env:
          CINEMATIC_URL: http://127.0.0.1:5184
          CINEMATIC_SOFTWARE_WEBGL: "1"
        run: npx playwright test --config tests/cinematic/playwright.config.ts tests/e2e/cinematic-flow-002.spec.ts tests/e2e/cinematic-lab-001.spec.ts tests/e2e/landing-001.spec.ts --reporter=line

      - name: Upload five-shot evidence and focused results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agriscope-cinematic-five-shot-${{ github.event.pull_request.head.sha }}
          path: |
            evidence/
            test-results/
          if-no-files-found: warn
          retention-days: 30
